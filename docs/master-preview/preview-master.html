<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GiroStock — Preview Admin Master</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme="dark"]{--bg:#0f0e10;--panel:#17161a;--raised:#1f1d22;--hover:#25232a;--accent:#d4ae4a;--accent-soft:rgba(212,174,74,.12);--accent-line:rgba(212,174,74,.30);--on:#17120a;--txt:#f2eee6;--txt2:#b4ada2;--txt3:#8f8980;--line:rgba(255,255,255,.08);--ok:#5fc48a;--warn:#f0a05a;--err:#ec7a72;--shadow:rgba(0,0,0,.5)}
:root[data-theme="light"]{--bg:#f4f1ea;--panel:#fff;--raised:#f8f5ee;--hover:#f1ece0;--accent:#8f6810;--accent-soft:rgba(143,104,16,.10);--accent-line:rgba(143,104,16,.28);--on:#fff;--txt:#231f1a;--txt2:#5d564c;--txt3:#7d766b;--line:rgba(35,31,26,.10);--ok:#1f7a4d;--warn:#b25e12;--err:#b3372f;--shadow:rgba(0,0,0,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.top{display:flex;align-items:center;gap:14px;height:68px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:'Playfair Display',serif;font-weight:800;font-size:20px;color:var(--accent)}
.master{font-size:10.5px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--on)}
.top nav{display:flex;gap:4px;flex:1;flex-wrap:wrap;margin-left:8px}
.top nav a{padding:8px 13px;border-radius:999px;color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer}
.top nav a:hover{background:var(--raised);color:var(--txt)}
.top nav a.on{background:var(--accent);color:var(--on);font-weight:700}
.tg{border:1px solid var(--line);background:var(--raised);color:var(--accent);border-radius:999px;padding:7px 12px;font-weight:700;font-size:12px}
main{padding:22px 28px 60px;max-width:1400px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.head h2{margin:0;font-size:26px;font-weight:700;margin-right:auto}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:800;font-size:13px;background:var(--accent);color:var(--on);text-transform:uppercase;letter-spacing:.3px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--txt);text-transform:none;font-weight:700}
.btn.ghost:hover{background:var(--raised)}
.btn.sm{padding:7px 11px;font-size:12px}
.btn.danger{background:none;border:1px solid var(--err);color:var(--err);text-transform:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h4{margin:0 0 12px;font-size:15px;font-weight:700}
.card small.t{display:block;color:var(--txt3);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.big{font-size:26px;font-weight:800}
.st{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.off{background:var(--txt3)}
.sub{font-size:12px;color:var(--txt3)}
.hero{background:var(--accent-soft);border-color:var(--accent-line)}
.bar{height:8px;border-radius:999px;background:var(--raised);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar i.warn{background:var(--warn)}.bar i.err{background:var(--err)}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:none}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:6px}
.chart span{flex:1;background:var(--accent-line);border-radius:3px 3px 0 0;min-height:2px}
.chart span.hi{background:var(--err)}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 12px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--txt3);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--raised)}
tr.click{cursor:pointer}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--raised);color:var(--txt2);border:1px solid var(--line)}
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.err{color:var(--err);border-color:var(--err)}
.banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.banner.warn{background:rgba(240,160,90,.10);border-color:var(--warn)}
.ov{position:fixed;inset:0;background:var(--shadow);display:none;z-index:50}
.ov.show{display:flex}
.drawer{margin-left:auto;width:min(480px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);padding:22px;overflow:auto}
.modal{margin:auto;width:min(560px,94%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.modal h3,.drawer h3{margin:0 0 6px;font-size:20px}
.x{float:right;background:none;border:none;color:var(--txt2);font-size:22px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--txt3);margin:12px 0 5px}
.sw{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px}
.sw button{width:40px;height:22px;border-radius:999px;border:1px solid var(--line);background:var(--raised);position:relative;padding:0;flex:none}
.sw button::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--txt3);transition:.15s}
.sw button.on{background:var(--accent-soft);border-color:var(--accent)}
.sw button.on::after{left:20px;background:var(--accent)}
.note{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:14px 18px;margin-top:20px;color:var(--txt2);line-height:1.6;font-size:13px}
.note b{color:var(--txt)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--accent);color:var(--txt);padding:12px 16px;border-radius:12px;display:none;z-index:99;font-weight:600;max-width:420px}
#band{position:sticky;top:0;z-index:45}
.band{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn);color:var(--on);padding:9px 28px;font-weight:700;font-size:13px}
.band b{letter-spacing:.6px}
.band button{background:var(--on);color:var(--txt);border:none;border-radius:8px;padding:6px 12px;font-weight:800;font-size:12px}
:root[data-theme="dark"] .band button{color:#f2eee6;background:#17120a}
:root[data-theme="light"] .band button{color:#fff;background:#231f1a}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-ok{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--ok);color:var(--ok)}
.chip-no{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--txt3);text-decoration:line-through}
.diff{color:var(--warn);font-weight:800}
.steps{display:flex;gap:8px;margin:12px 0 4px}.steps span{flex:1;text-align:center;font-size:12px;font-weight:700;padding:8px;border-radius:10px;border:1px solid var(--line);color:var(--txt3)}.steps span.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.steps span.done{color:var(--ok);border-color:var(--ok)}
.prog{height:10px;border-radius:999px;background:var(--raised);overflow:hidden;margin-top:12px}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media(max-width:900px){.g4,.g3,.g2{grid-template-columns:1fr 1fr}main{padding:16px}}
</style>
</head>

function bandRender(){

function testeTela(){
  const keys=Object.keys(PROD);
  return `<div class="head"><h2>Modo teste</h2><span class="sub">banco separado: <b>girostock_teste</b> ≠ produção</span></div>
  <div class="grid g4" style="margin-bottom:12px">

   <div class="card"><small class="t">Última cópia da produção</small><div class="big" style="font-size:20px">${T.copiado||'nunca'}</div><div class="sub">${T.copiado?'por Lucas Mendes'+(T.anon?' · clientes anonimizados':''):'será feita na 1ª ativação'}</div></div>
   <div class="card"><small class="t">Quem usa o teste agora</small><div class="big">${T.ativo?1:0}</div><div class="sub">só a sessão que ligou · demais seguem em produção</div></div>

    <div class="sub" style="margin-top:8px">O modo teste vale para <b>o usuário logado, nesta sessão</b>. Os demais usuários continuam em produção. Quem tiver a permissão "Modo teste" vê o mesmo botão na própria conta e, ao ligar, trabalha na <b>sua própria empresa e lojas</b>, só que no banco de teste.</div>
    <div style="margin-top:12px">${T.ativo?'<button class="btn ghost" onclick="desligaTeste()">Voltar à produção</button> <button class="btn" onclick="simulaVenda()">Simular venda de teste</button>':'<button class="btn" onclick="ligaTeste()">Ligar modo teste</button>'}</div></div>
   <div class="card"><h4>Copiar tudo da produção</h4>
    <div class="sub">Substitui <b>todos</b> os dados do banco de teste por uma cópia atual da produção. Só no sentido produção → teste, nunca o contrário. Só o Master pode fazer.</div>

  </div>

}

  if(USR.some(u=>u.e.toLowerCase()===NU.e.toLowerCase())){toast('Já existe usuário com este e-mail (o e-mail é único no sistema)');return}
  if(NU.perfil!=='Administrador'&&!NU.lojas.length){toast('Escolha ao menos uma loja');return}
  if(e.lim.users[0]>=e.lim.users[1]){toast('Limite de usuários do plano atingido');return}
  e.lim.users[0]++;e.users++;
  USR.unshift({n:NU.n,e:NU.e,emp:e.nome,perfil:NU.perfil,ult:'nunca',falhas:0,on:true,mt:false});
  audit('config',e.nome,'Usuário criado: '+NU.n+' ('+NU.perfil+')');
  const dr=$('#ovD').classList.contains('show');fechar();render();if(dr)abreEmp(e.id);toast('Usuário criado em '+e.nome);
}

/* ---------- USUÁRIOS ---------- */
function usuarios(){
  return `<div class="head"><h2>Usuários & segurança</h2><button class="btn" onclick="modalNovoUsr()">+ Novo usuário</button></div>
  <div class="grid g3" style="margin-bottom:12px">
   <div class="card"><small class="t">Usuários ativos</small><div class="big">${USR.filter(u=>u.on).length}</div><div class="sub">de ${USR.length} cadastrados</div></div>
   <div class="card ${USR.some(u=>u.falhas>=3)?'':''}" style="${USR.some(u=>u.falhas>=3)?'border-color:var(--warn)':''}"><small class="t">Logins com falha (24 h)</small><div class="big" style="color:var(--warn)">${USR.reduce((s,u)=>s+u.falhas,0)}</div><div class="sub">${USR.filter(u=>u.falhas>=3).length} usuário(s) com 3+ tentativas</div></div>
   <div class="card"><small class="t">Sem login há 30+ dias</small><div class="big">1</div><div class="sub">candidatos a desativar</div></div>
  </div>
  <div class="card" style="margin-bottom:12px"><h4>Perfil Master</h4>
   <div class="grid g2">
    <div>
     <div class="line"><span>Empresa</span><b>Plataforma (sem lojas e sem dados)</b></div>
     <div class="line"><span>Como é criado</span><b>só por script (<code>npm run master</code>)</b></div>
     <div class="line"><span>Aparece na tela de usuários das empresas?</span><b>Não</b></div>
     <div class="line"><span>Pode ser editado/desativado por empresa?</span><b>Não</b></div>
    </div>
    <div><div class="sub" style="margin-bottom:6px">Áreas do perfil Master</div>
     <div class="chips"><span class="chip-ok">Master</span><span class="chip-ok">Modo teste</span><span class="chip-no">Vendas</span><span class="chip-no">Estoque</span><span class="chip-no">Relatórios</span><span class="chip-no">Pedidos</span><span class="chip-no">Clientes</span><span class="chip-no">Configurações</span></div>
     <div class="sub" style="margin-top:8px">O Master não opera dados de empresas em produção. Em modo teste ele escolhe uma empresa e atua como Administrador dela, só no banco de teste.</div></div>
   </div></div>
  <div class="tbl"><table><thead><tr><th>Usuário</th><th>Empresa</th><th>Perfil</th><th>Último login</th><th>Falhas</th><th>Modo teste</th><th>Situação</th><th></th></tr></thead><tbody>
  ${USR.map((u,i)=>`<tr><td><b>${u.n}</b><div class="sub">${u.e}</div></td><td>${u.emp}</td><td><span class="tag">${u.perfil}</span></td><td>${u.ult}</td><td>${u.falhas>=3?`<span class="pill warn">${u.falhas}</span>`:u.falhas}</td><td>${u.perfil==='Master'?'<span class="tag" title="Padrão do perfil Master">sempre</span>':`<div class="sw" style="margin:0"><button class="${u.mt?'on':''}" onclick="togMT(${i})"></button><span class="sub">${u.mt?'liberado':'—'}</span></div>`}</td><td><span class="pill ${u.on?'ok':'err'}">${u.on?'Ativo':'Inativo'}</span></td><td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" onclick="forca(${i})">Forçar troca de senha</button> <button class="btn ghost sm" onclick="encerra(${i})">Encerrar sessões</button> <button class="btn ${u.on?'danger':'ghost'} sm" ${u.perfil==='Master'?'disabled':''} onclick="togUser(${i})">${u.on?'Desativar':'Reativar'}</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function togMT(i){USR[i].mt=!USR[i].mt;audit('seguranca',USR[i].emp,'Permissão Modo teste '+(USR[i].mt?'liberada':'retirada')+': '+USR[i].n);render();toast('Modo teste '+(USR[i].mt?'liberado para ':'retirado de ')+USR[i].n+(!USR[i].mt&&T.ativo?' · sessões em modo teste dele caem na hora':''))}
function forca(i){audit('seguranca',USR[i].emp,'Troca de senha forçada: '+USR[i].n);toast('Troca de senha exigida no próximo login de '+USR[i].n)}
function encerra(i){audit('seguranca',USR[i].emp,'Sessões encerradas: '+USR[i].n);toast('Todas as sessões de '+USR[i].n+' foram encerradas')}
function togUser(i){USR[i].on=!USR[i].on;audit('seguranca',USR[i].emp,(USR[i].on?'Reativado: ':'Desativado: ')+USR[i].n);render();toast(USR[i].n+(USR[i].on?' reativado':' desativado'))}

/* ---------- BACKUPS ---------- */
function backups(){
  return `<div class="head"><h2>Backups & dados</h2><button class="btn" id="bGera" onclick="geraBkp()">💾 Gerar backup agora</button></div>
  <div class="grid g3" style="margin-bottom:12px">
   <div class="card hero"><small class="t">Último backup</small><div class="big" style="color:var(--accent)">${BKP[0][0].slice(0,10)}</div><div class="sub">${BKP[0][0].slice(11)} · ${BKP[0][2]} · ${BKP[0][1]}</div></div>
   <div class="card"><small class="t">Rotina automática</small><div class="st"><span class="dot"></span>Diária às 03:00</div><div class="sub">mantém os últimos 30 backups</div></div>
   <div class="card"><small class="t">Espaço usado por backups</small><div class="big">7,2 GB</div><div class="sub">de 20 GB reservados</div></div>
  </div>
  <div id="prog"></div>
  <div class="tbl" style="margin-top:12px"><table><thead><tr><th>Data</th><th>Tipo</th><th>Tamanho</th><th>Situação</th><th></th></tr></thead><tbody>
  ${BKP.map((b,i)=>`<tr><td>${b[0]}</td><td>${b[1]}</td><td>${b[2]}</td><td><span class="pill ok">Concluído</span></td><td style="text-align:right"><button class="btn ghost sm" onclick="toast('Download iniciado: backup ${b[0]}')">Baixar</button> <button class="btn danger sm" onclick="modalRest(${i})">Restaurar</button></td></tr>`).join('')}
  </tbody></table></div>
  <div class="card" style="margin-top:12px"><h4>Dados por empresa</h4>
   ${EMP.map(e=>`<div class="line"><span><b>${e.nome}</b></span><span><button class="btn ghost sm" onclick="toast('Exportação (zip) de ${e.nome} enviada por e-mail')">Exportar dados</button></span></div>`).join('')}
   <div class="sub" style="margin-top:8px">Útil para LGPD (pedido do titular) e para migração de servidor.</div></div>
  <div class="card" style="margin-top:12px"><h4>Manutenção</h4><div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn ghost" onclick="toast('Saldos de estoque e insumos recalculados · 0 divergências')">Recalcular saldos de estoque</button>
   <button class="btn ghost" onclick="toast('Reindexação concluída em 4 s')">Reindexar banco</button>
   <button class="btn ghost" onclick="toast('1 tarefa falha reprocessada (impressão)')">Reprocessar tarefas com falha (1)</button></div></div>`;
}
function geraBkp(){
  $('#bGera').disabled=true;$('#prog').innerHTML='<div class="card"><b>Gerando backup…</b><div class="prog"><i id="pb"></i></div></div>';
  let p=0;const t=setInterval(()=>{p+=12+Math.random()*18;$('#pb').style.width=Math.min(p,100)+'%';if(p>=100){clearInterval(t);BKP.unshift(['11/10/2026 '+new Date().toTimeString().slice(0,5),'Manual (Lucas)','249 MB','ok']);audit('backup','—','Backup manual gerado');render();toast('Backup concluído (249 MB)')}},250);
}
function modalRest(i){
  $('#modal').innerHTML=`<button class="x" onclick="fechar()">×</button><h3>Restaurar backup de ${BKP[i][0]}?</h3>
  <div class="banner warn" style="margin-top:10px"><span>⚠</span><div>Isso <b>substitui todos os dados atuais</b> pelos do backup. Tudo o que foi feito depois dele será perdido. O sistema ficará em manutenção durante o processo.</div></div>
  <label>Digite RESTAURAR para confirmar</label><input id="rc">
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button class="btn ghost" onclick="fechar()">Cancelar</button><button class="btn danger" onclick="if($('#rc').value==='RESTAURAR'){fechar();toast('Restauração agendada (simulação)')}else toast('Digite RESTAURAR')">Restaurar</button></div>`;
  $('#ovM').classList.add('show');
}

/* ---------- AUDITORIA ---------- */
let audF='todos';
function audit(t,emp,txt){AUD.unshift(['11/10 '+new Date().toTimeString().slice(0,5),'Lucas Mendes (master)',emp,t,txt])}
function auditoria(){
  const tipos=['todos','suporte','suspensao','seguranca','login_falha','backup','config','venda','pedido','cancelamento'];
  const L=AUD.filter(a=>audF==='todos'||a[3]===audF);
  return `<div class="head"><h2>Auditoria geral</h2><button class="btn ghost sm" onclick="toast('Exportação CSV gerada')">Exportar CSV</button></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">${tipos.map(t=>`<button class="tag" style="cursor:pointer;${audF===t?'border-color:var(--accent);color:var(--accent);background:var(--accent-soft)':''}" onclick="audF='${t}';render()">${t}</button>`).join('')}</div>
  <div class="tbl"><table><thead><tr><th>Quando</th><th>Quem</th><th>Empresa</th><th>Tipo</th><th>Detalhe</th></tr></thead><tbody>
  ${L.map(a=>`<tr><td style="white-space:nowrap">${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td><span class="tag">${a[3]}</span></td><td>${a[4]}</td></tr>`).join('')||'<tr><td colspan="5" class="sub" style="text-align:center;padding:24px">Nada neste filtro</td></tr>'}</tbody></table></div>
  <div class="note"><b>Regra:</b> toda ação do painel master (entrar como suporte, suspender, forçar troca de senha, restaurar backup) entra aqui, com quem fez, quando e o motivo. Esse registro não pode ser apagado pelo painel.</div>`;
}

/* ---------- CONFIG ---------- */
function config(){
  return `<div class="head"><h2>Configurações globais</h2></div>
  <div class="grid g2">
   <div class="card"><h4>Integrações</h4>${integ.map((x,i)=>`<div class="line"><span><span class="dot ${x.on?'':'off'}"></span> <b>${x.n}</b><div class="sub" style="margin-left:18px">${x.det}</div></span><button class="btn ghost sm" onclick="toast('${x.on?'Teste de conexão: ok':'Abriria a configuração de '+x.n}')">${x.on?'Testar':'Configurar'}</button></div>`).join('')}
     <div class="sub" style="margin-top:8px">Chaves e senhas nunca aparecem na tela: só o status.</div></div>
   <div class="card"><h4>Aviso para todos os usuários</h4>
     <label style="margin-top:0">Mensagem</label><textarea id="av" rows="3" placeholder="Ex.: Manutenção programada hoje às 22h (15 minutos)."></textarea>

   <div class="card"><h4>Parâmetros padrão</h4>
     <div class="line"><span>VIP: total gasto a partir de</span><b>R$ 400,00</b></div>
     <div class="line"><span>Cliente "em risco" após</span><b>30 dias</b></div>
     <div class="line"><span>Cliente "inativo" após</span><b>60 dias</b></div>
     <div class="line"><span>Pedido "atrasado" após</span><b>25 min</b></div>
     <div class="line"><span>Retenção de backups</span><b>30 dias</b></div>
     <button class="btn ghost sm" style="margin-top:10px" onclick="toast('Abriria a edição dos parâmetros')">Editar parâmetros</button></div>
   <div class="card"><h4>Planos e recursos</h4>
     <div class="line"><span><b>Básico</b> — PDV, estoque, caixa</span><span class="tag">1 loja · 3 usuários</span></div>
     <div class="line"><span><b>Completo</b> — + Pedidos, Clientes, Relatórios</span><span class="tag">3 lojas · 10 usuários</span></div>
     <button class="btn ghost sm" style="margin-top:10px" onclick="toast('Abriria a edição dos planos')">Editar planos</button></div>
  </div>`;
}
function enviaAviso(){const v=$('#av').value.trim();if(!v){toast('Escreva a mensagem');return}window.aviso=v;audit('config','Todas','Aviso global publicado');toast('Aviso publicado para todos os usuários');tab='geral';nav();render()}
function modalAviso(){go('config')}
function modalManut(){go('config')}

function fechar2(){}
function fechar(){$('#ovD').classList.remove('show');$('#ovM').classList.remove('show')}
$('#ovD').onclick=e=>{if(e.target.id==='ovD')fechar()};
$('#ovM').onclick=e=>{if(e.target.id==='ovM')fechar()};
$('#tg').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
nav();render();
</script>
